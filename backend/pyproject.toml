[project]
name = "notification-management-backend"
version = "0.1.0"
description = "高校通知管理系统 Flask 服务端"
requires-python = ">=3.12,<3.15"
dependencies = [
  "Flask==3.0.0",
  "SQLAlchemy==2.0.51",
  "alembic==1.18.5",
  "cryptography==50.0.2",
  "ddgs==9.5.2",
  "defusedxml==0.7.1",
  # ddgs 9.5.2 使用 primp 的 safari_16 指纹；primp 2.x 移除了该值，必须锁定兼容版本。
  "primp==0.15.0",
  "openpyxl==3.1.5",
  "pillow==12.0.0",
  "playwright==1.56.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.4",
  "pypdf>=6.21.1",
  "tzdata==2026.2",
  "waitress==3.0.2",
  "xlrd==2.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
